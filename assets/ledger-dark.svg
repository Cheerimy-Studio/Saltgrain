 x="551" y="96" fill="#5cab9b" font-size="10.5">@StevenQinDev</text><text x="551" y="110" fill="#7a867f" font-size="9">尽吾志也而不能至者，可…</text><line x1="688" y1="82.0" x2="714" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="714" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="725" y="65" fill="#d9a64c" font-size="13" font-weight="700">#293</text><text x="725" y="81" fill="#e5e9e3" font-size="10">1142dcaae178bf94&#8230;</text><text x="725" y="96" fill="#5cab9b" font-size="10.5">@StevenQinDev</text><text x="725" y="110" fill="#7a867f" font-size="9">锲而不舍，金石可镂</text><line x1="862" y1="82.0" x2="888" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="888" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="899" y="65" fill="#d9a64c" font-size="13" font-weight="700">#294</text><text x="899" y="81" fill="#e5e9e3" font-size="10">2275c846f1964327&#8230;</text><text x="899" y="96" fill="#5cab9b" font-size="10.5">@StevenQinDev</text><text x="899" y="110" fill="#7a867f" font-size="9">志之所趋，无远弗届</text></svg>
